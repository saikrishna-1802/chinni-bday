name: Deploy → GitHub Pages

on:
  push:
    branches: [main]          # only deploy from main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: []

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload all 3 files as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'            # uploads index.html + styles.css + app.js

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print live URL
        run: |
          echo "Satwika birthday site is live at:"
          echo "${{ steps.deploy.outputs.page_url }}"
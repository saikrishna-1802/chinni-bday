name: CI — Validate Single File Website

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Create config
        run: |
          cat > .htmlvalidate.json << 'EOF'
          {
            "extends": ["html-validate:recommended"],
            "rules": {
              "no-inline-style": "off",
              "require-sri": "off",
              "no-trailing-whitespace": "off",
              "attr-quotes": "off",
              "void-style": "off",
              "no-redundant-role": "off",
              "svg-focusable": "off",
              "aria-label-misuse": "off",
              "element-permitted-content": "off",
              "no-unknown-elements": "off",
              "prefer-native-element": "off",
              "valid-id": "off",
              "no-implicit-button-type": "off",
              "parser-error": "off"
            }
          }
          EOF

      - name: Validate index.html
        run: html-validate index.html

  check-files:
    name: Check Required Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "MISSING: index.html"
            exit 1
          else
            echo "OK: index.html ($(wc -c < index.html) bytes)"
          fi

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs:
      - validate-html
      - check-files

    steps:
      - uses: actions/checkout@v4

      - name: Verify HTML contains required tags
        run: |
          grep -q "<html" index.html || exit 1
          grep -q "<head" index.html || exit 1
          grep -q "<body" index.html || exit 1
          echo "HTML structure looks good"

      - name: Show file size
        run: |
          echo "index.html size:"
          wc -c index.html